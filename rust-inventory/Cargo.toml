[package]
name = "rust-inventory"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.13"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.51", features = ["full"] }
tokio-postgres = { version = "0.7.17", features = ["with-uuid-1", "with-chrono-0_4"] }
uuid = { version = "1.23", features = ["v4"] }
chrono = { version = "0.4.44", features = ["serde"] }
actix-web-prom = "0.10"
prometheus = "0.14"
