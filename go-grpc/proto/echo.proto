syntax = "proto3";

package echo.v1;

option go_package = "github.com/endgrainlabs/example-stack/go-grpc/proto/echopb";

service EchoService {
  rpc Echo(EchoRequest) returns (EchoResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
  string received_at = 2;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string uptime = 2;
}
