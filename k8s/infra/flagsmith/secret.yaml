# Demo-only credentials, committed the same way k8s/apps/base/secrets.yaml is.
# Every value here is a fixed default so the stack comes up the same way on any
# machine; none of it is a production secret. The database URL names the
# PostgreSQL Service in the example-stack namespace, which holds the flagsmith
# database alongside inventory and orders.
apiVersion: v1
kind: Secret
metadata:
  name: flagsmith
  namespace: flagsmith
type: Opaque
stringData:
  database-url: "postgres://postgres:postgres@postgres.example-stack.svc.cluster.local:5432/flagsmith"
  django-secret-key: "demo-only-django-secret-key-not-a-real-secret"
