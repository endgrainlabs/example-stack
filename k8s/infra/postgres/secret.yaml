# Demo-only credential, committed the same way k8s/apps/base/secrets.yaml is.
# PostgreSQL has its own Secret rather than a key in example-secrets because
# the infra Kustomization reconciles it before apps exists, and a pod that
# names a missing Secret never starts. The password is never checked (see
# POSTGRES_HOST_AUTH_METHOD in postgres.yaml); it is set so the postgres role
# has the password the connection strings in example-secrets and the flagsmith
# Secret carry.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: example-stack
type: Opaque
stringData:
  password: "postgres"
