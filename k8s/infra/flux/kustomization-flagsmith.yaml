# dependsOn apps, not nothing: the ServiceMonitor needs the Prometheus
# operator custom resource definitions the monitoring Kustomization installs,
# and the migration Job needs the flagsmith database in the PostgreSQL the
# apps Kustomization brings up. Depending on apps covers both, because apps
# already depends on monitoring.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flagsmith
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: apps
  sourceRef:
    kind: GitRepository
    name: example-stack
  path: ./k8s/infra/flagsmith
  prune: true
  wait: true
  timeout: 10m
