apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-inventory
  namespace: example-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust-inventory
  template:
    metadata:
      labels:
        app: rust-inventory
    spec:
      containers:
        - name: rust-inventory
          image: example-stack-registry:5000/example-stack/rust-inventory:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: example-secrets
                  key: api-token
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: example-secrets
                  key: postgres-dsn
            - name: LISTEN_ADDR
              value: "0.0.0.0:8081"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rust-inventory
  namespace: example-stack
  labels:
    app: rust-inventory
spec:
  selector:
    app: rust-inventory
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rust-inventory
  namespace: example-stack
  labels:
    app: rust-inventory
spec:
  selector:
    matchLabels:
      app: rust-inventory
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
