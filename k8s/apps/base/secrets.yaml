# Demo-only credentials. Every value here is a fixed default so the stack
# comes up the same way on any machine; none of it is a production secret.
apiVersion: v1
kind: Secret
metadata:
  name: example-secrets
  namespace: example-stack
type: Opaque
stringData:
  api-token: "dev-token"
  postgres-dsn: "host=postgres user=postgres password=postgres dbname=inventory sslmode=disable"
  postgres-orders-dsn: "host=postgres user=postgres password=postgres dbname=orders sslmode=disable"
