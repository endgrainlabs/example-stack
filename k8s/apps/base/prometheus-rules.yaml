apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: example-apps-slos
  namespace: example-stack
  labels:
    app.kubernetes.io/part-of: example-stack
spec:
  groups:
    # --- Service level objective recording rules ---
    - name: example-apps-slo-recording
      interval: 15s
      rules:
        # go-api error rate (5xx / total over 5m window)
        - record: goapi:http_error_rate:5m
          expr: |
            sum(rate(goapi_http_requests_total{status=~"5.."}[5m])) /
            clamp_min(sum(rate(goapi_http_requests_total[5m])), 1e-10)

        # go-api p50, p90, p99 latency
        - record: goapi:http_latency_p50:5m
          expr: histogram_quantile(0.50, sum(rate(goapi_http_request_duration_seconds_bucket[5m])) by (le))
        - record: goapi:http_latency_p90:5m
          expr: histogram_quantile(0.90, sum(rate(goapi_http_request_duration_seconds_bucket[5m])) by (le))
        - record: goapi:http_latency_p99:5m
          expr: histogram_quantile(0.99, sum(rate(goapi_http_request_duration_seconds_bucket[5m])) by (le))

        # go-api request rate
        - record: goapi:http_request_rate:5m
          expr: sum(rate(goapi_http_requests_total[5m]))

        # go-grpc error rate (non-OK / total over 5m window)
        - record: gogrpc:grpc_error_rate:5m
          expr: |
            sum(rate(grpc_server_handled_total{grpc_code!="OK"}[5m])) /
            clamp_min(sum(rate(grpc_server_handled_total[5m])), 1e-10)

        # go-grpc p50, p90, p99 latency
        - record: gogrpc:grpc_latency_p50:5m
          expr: histogram_quantile(0.50, sum(rate(grpc_server_handling_seconds_bucket[5m])) by (le))
        - record: gogrpc:grpc_latency_p90:5m
          expr: histogram_quantile(0.90, sum(rate(grpc_server_handling_seconds_bucket[5m])) by (le))
        - record: gogrpc:grpc_latency_p99:5m
          expr: histogram_quantile(0.99, sum(rate(grpc_server_handling_seconds_bucket[5m])) by (le))

        # go-grpc request rate
        - record: gogrpc:grpc_request_rate:5m
          expr: sum(rate(grpc_server_handled_total[5m]))

        # rust-inventory error rate (5xx / total over 5m window)
        - record: rustinventory:http_error_rate:5m
          expr: |
            sum(rate(rustinventory_http_requests_total{status=~"5.."}[5m])) /
            clamp_min(sum(rate(rustinventory_http_requests_total[5m])), 1e-10)

        # rust-inventory p50, p90, p99 latency. actix-web-prom names the
        # histogram "requests_duration", not "request_duration".
        - record: rustinventory:http_latency_p50:5m
          expr: histogram_quantile(0.50, sum(rate(rustinventory_http_requests_duration_seconds_bucket[5m])) by (le))
        - record: rustinventory:http_latency_p90:5m
          expr: histogram_quantile(0.90, sum(rate(rustinventory_http_requests_duration_seconds_bucket[5m])) by (le))
        - record: rustinventory:http_latency_p99:5m
          expr: histogram_quantile(0.99, sum(rate(rustinventory_http_requests_duration_seconds_bucket[5m])) by (le))

        # rust-inventory request rate
        - record: rustinventory:http_request_rate:5m
          expr: sum(rate(rustinventory_http_requests_total[5m]))

    # --- Alerting rules ---
    - name: example-apps-alerts
      rules:
        # go-api alerts
        - alert: GoApiHighErrorRate
          expr: goapi:http_error_rate:5m > 0.05
          for: 2m
          labels:
            severity: warning
            service: go-api
          annotations:
            summary: "go-api error rate above 5%"
            description: "go-api 5xx error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

        - alert: GoApiHighLatency
          expr: goapi:http_latency_p99:5m > 0.5
          for: 2m
          labels:
            severity: warning
            service: go-api
          annotations:
            summary: "go-api p99 latency above 500ms"
            description: "go-api p99 latency is {{ $value | humanizeDuration }}."

        # go-grpc alerts
        - alert: GoGrpcHighErrorRate
          expr: gogrpc:grpc_error_rate:5m > 0.05
          for: 2m
          labels:
            severity: warning
            service: go-grpc
          annotations:
            summary: "go-grpc error rate above 5%"
            description: "go-grpc non-OK rate is {{ $value | humanizePercentage }} over the last 5 minutes."

        - alert: GoGrpcHighLatency
          expr: gogrpc:grpc_latency_p99:5m > 0.5
          for: 2m
          labels:
            severity: warning
            service: go-grpc
          annotations:
            summary: "go-grpc p99 latency above 500ms"
            description: "go-grpc p99 latency is {{ $value | humanizeDuration }}."

        # rust-inventory alerts
        - alert: RustInventoryHighErrorRate
          expr: rustinventory:http_error_rate:5m > 0.05
          for: 2m
          labels:
            severity: warning
            service: rust-inventory
          annotations:
            summary: "rust-inventory error rate above 5%"
            description: "rust-inventory 5xx error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

        - alert: RustInventoryHighLatency
          expr: rustinventory:http_latency_p99:5m > 0.5
          for: 2m
          labels:
            severity: warning
            service: rust-inventory
          annotations:
            summary: "rust-inventory p99 latency above 500ms"
            description: "rust-inventory p99 latency is {{ $value | humanizeDuration }}."

        # Cross-cutting infrastructure alerts
        # More than two restarts in ten minutes. A service that restarts once
        # or twice while the migration Jobs run is doing what it is built to
        # do, and a single restart is not a loop.
        - alert: ExampleAppCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="example-stack"}[10m]) > 2
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has restarted {{ $value }} times in the last 10 minutes."

        # A Job pod that has finished is never ready again, so completed and
        # failed pods are excluded. Without this the migration Jobs keep the
        # alert firing until their ten minute garbage collection.
        - alert: ExampleAppNotReady
          expr: |
            kube_pod_status_ready{namespace="example-stack", condition="true"} == 0
            unless on(namespace, pod)
            kube_pod_status_phase{namespace="example-stack", phase=~"Succeeded|Failed"} == 1
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} not ready"
            description: "Pod {{ $labels.pod }} has been not-ready for more than 3 minutes."

        - alert: ExampleAppReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{namespace="example-stack"}
            != kube_deployment_status_ready_replicas{namespace="example-stack"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.deployment }} replica mismatch"
            description: "Deployment {{ $labels.deployment }} has had fewer than its {{ $value }} desired replicas ready for more than 5 minutes."
