# Migration Jobs are named with a version suffix. When migration content
# changes, bump the suffix (for example v1 to v2). Flux then creates a new Job
# and leaves the completed one alone. Finished Jobs are garbage-collected after
# 10 minutes.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-inventory-v1
  namespace: example-stack
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: migrate
        database: inventory
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: example-stack-registry:5000/example-stack/migrate:latest
          imagePullPolicy: Always
          args: ["-dir", "inventory"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: example-secrets
                  key: postgres-dsn
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-orders-v1
  namespace: example-stack
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
