apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
  namespace: example-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-api
  template:
    metadata:
      labels:
        app: go-api
    spec:
      containers:
        - name: go-api
          image: example-stack-registry:5000/example-stack/go-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: example-secrets
                  key: api-token
            - name: LISTEN_ADDR
              value: ":8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: example-secrets
                  key: postgres-orders-dsn
            - name: GRPC_ADDR
              value: "go-grpc:9090"
            - name: INVENTORY_URL
              value: "http://rust-inventory:8081"
            # Feature flags, evaluated locally from Flagsmith's production
            # environment. setup.sh writes the key before it applies this
            # Deployment; the reference is optional so that a Secret without
            # it starts the service with every flag off rather than not at
            # all.
            - name: FLAGSMITH_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: flagsmith-bootstrap
                  key: production-server
                  optional: true
            - name: FLAGSMITH_API_URL
              value: "http://flagsmith.flagsmith.svc.cluster.local:8000/api/v1/"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: go-api
  namespace: example-stack
  labels:
    app: go-api
spec:
  selector:
    app: go-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: go-api
  namespace: example-stack
  labels:
    app: go-api
spec:
  selector:
    matchLabels:
      app: go-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
