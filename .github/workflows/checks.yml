name: checks

# Dispatched, never triggered: run it against a branch before merge with
# `gh workflow run checks.yml --ref <branch>`. Nothing runs on push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # hashFiles is available on steps, not on jobs, so each language gates
      # its own steps after checkout. A repository without that language
      # skips them.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: hashFiles('**/go.mod') != ''
        with:
          go-version-file: go.mod
      - if: hashFiles('**/go.mod') != ''
        run: test -z "$(gofmt -l .)"
      - if: hashFiles('**/go.mod') != ''
        run: go vet ./...
      - if: hashFiles('**/go.mod') != ''
        run: go test ./...
      # Static checks that need no cluster: shellcheck and actionlint from
      # the pins in the Makefile, semgrep from its digest-pinned container
      # through the runner's docker. CI is set here, so a skip fails.
      - run: make lint

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('**/package-lock.json') != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: hashFiles('**/package-lock.json') != ''
        run: npm ci
      - if: hashFiles('**/package-lock.json') != ''
        run: npm run typecheck --if-present
      - if: hashFiles('**/package-lock.json') != ''
        run: npm test
