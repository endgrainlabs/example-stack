# Routine version updates. Security updates are a repository setting, on
# here, and need no config; this adds the monthly bumps that catch a stale
# line before there is an advisory. Each pull request runs the checks like
# any other.
#
# Not covered, because Dependabot has no ecosystem for them: the k3s,
# PostgreSQL, Forgejo, and registry images pinned in the manifests and
# scripts, and the chart versions in the HelmReleases.
#
# Subjects follow CONTRIBUTING.md's type(scope): subject form.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /rust-inventory
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /go-api
      - /go-grpc
      - /migrate
      - /rust-inventory
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    groups:
      base-images:
        patterns: ["*"]
    # The Rust build image and rust-inventory/rust-toolchain.toml name the
    # same version, and cargo inside the image reads the file: a bump to one
    # without the other makes rustup download a second toolchain on every
    # build. The two move together by hand.
    ignore:
      - dependency-name: "*rust"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns: ["*"]
