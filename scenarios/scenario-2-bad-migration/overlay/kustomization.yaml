apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../k8s/apps/base
  - migrate-inventory-v2.yaml
patches:
  - target:
      group: batch
      version: v1
      kind: Job
      name: migrate-inventory-v2
      namespace: example-stack
    path: migrate-extra-dir-patch.yaml
configMapGenerator:
  - name: scenario-2-migrations
    namespace: example-stack
    files:
      - 003_rename_quantity.sql=migrations/003_rename_quantity.sql
# The Job and the reset both name the ConfigMap, so its name has to be the one
# written here rather than a content hash.
generatorOptions:
  disableNameSuffixHash: true
